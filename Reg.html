<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameKeys - Авторизация</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fas fa-key"></i>
                <h1>GameKeys</h1>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Войти</button>
                <button class="tab-btn" data-tab="register">Зарегистрироваться</button>
            </div>

            <!-- Форма входа -->
            <div class="tab-content active" id="loginTab">
                <form id="loginForm">
                    <div class="input-group">
                        <input type="email" id="loginEmail" placeholder="Электронная почта" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="loginPassword" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="btn login-btn">Войти</button>
                </form>
                <p class="forgot-password">Забыли пароль? <a href="#">Восстановить</a></p>
            </div>

            <!-- Форма регистрации -->
            <div class="tab-content" id="registerTab">
                <form id="registerForm">
                    <div class="input-group">
                        <input type="text" id="registerName" placeholder="Имя" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="registerEmail" placeholder="Электронная почта" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="registerPassword" placeholder="Пароль" required>
                        <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" id="registerConfirmPassword" placeholder="Подтвердите пароль" required>
                    </div>
                    <button type="submit" class="btn register-btn">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>

    <script src="Script_Reg.js"></script>
</body>
</html>
